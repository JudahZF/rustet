[package]
name = "rustet-integrations"
description = "Media integrations of the shell: MPRIS, system tray, Discord Rich Presence, Last.fm and ListenBrainz scrobbling, Windows media controls."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
futures.workspace = true
md-5 = "0.10"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# ksni 0.3 is built on zbus 5; MPRIS uses the same zbus so there is one D-Bus stack.
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
percent-encoding = "2"
png = "0.17"
x11rb = { version = "0.13", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# XTEST fakes key presses on the private Xvfb display of the media key test.
x11rb = { version = "0.13", default-features = false, features = ["xtest"] }
