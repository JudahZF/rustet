[package]
name = "rustet-desktop"
description = "Desktop state and services of the shell with no web-view dependency: preferences, encrypted store, themes, wallpaper lookup, links, engine supervisor."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.9"
aes-gcm = "0.11.1"
base64 = "0.22"
futures.workspace = true
cbc = { version = "0.2", features = ["alloc"] }
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11"
sha2 = "0.11"
thiserror.workspace = true
time = { version = "0.3", features = ["parsing"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
