[package]
name = "rustet-ui-pages"
description = "The page area of Rustet's UI: one view per catalog and library route."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustet-ampapi = { path = "../rustet-ampapi" }
rustet-app = { path = "../rustet-app" }
rustet-desktop = { path = "../rustet-desktop" }
rustet-player = { path = "../rustet-player" }
rustet-ui = { path = "../rustet-ui" }
futures.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
tokio.workspace = true
tracing.workspace = true

[features]
# gpui's test platform for headless view tests: `cargo test -p rustet-ui-pages --features test-support`.
test-support = ["gpui/test-support", "gpui_platform/test-support", "rustet-ui/test-support"]

[dev-dependencies]
# The example plays both roles of the `rustet` binary: the window and `<exe> engine …`.
rustet-engine = { path = "../rustet-engine" }
anyhow.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }

[[example]]
name = "pages"
path = "examples/pages/main.rs"
