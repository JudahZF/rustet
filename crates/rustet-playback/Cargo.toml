[package]
name = "rustet-playback"
description = "Playback session lifecycle and the background pre-warm scheduler."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustet-core = { path = "../rustet-core" }
