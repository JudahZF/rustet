[package]
name = "rustet-app"
description = "Rustet's application logic without a UI toolkit: routes, page models and loaders, library sync, engine link, account, settings, desktop integrations."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustet-ampapi = { path = "../rustet-ampapi" }
rustet-core = { path = "../rustet-core" }
rustet-desktop = { path = "../rustet-desktop" }
rustet-integrations = { path = "../rustet-integrations" }
rustet-library = { path = "../rustet-library" }
rustet-player = { path = "../rustet-player" }
fastrand = "2"
futures.workspace = true
quick-xml = "0.38"
# The engine's TLS identity (the same features as rustet-engine's rcgen).
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = "2"

[dev-dependencies]
# The real engine of tests/services_engine.rs (run as a child of the test binary).
rustet-engine = { path = "../rustet-engine" }
tempfile = "3"
# The fake HTTPS engine of tests/services*.rs.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
