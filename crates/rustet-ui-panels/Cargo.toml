[package]
name = "rustet-ui-panels"
description = "The Settings and Downloads pages of Rustet's UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustet-app = { path = "../rustet-app" }
rustet-core = { path = "../rustet-core" }
rustet-desktop = { path = "../rustet-desktop" }
rustet-integrations = { path = "../rustet-integrations" }
rustet-player = { path = "../rustet-player" }
rustet-ui = { path = "../rustet-ui" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# gpui's test platform for headless view tests: `cargo test -p rustet-ui-panels --features test-support`.
test-support = ["gpui/test-support", "gpui_platform/test-support", "rustet-ui/test-support", "preview"]
# Built model values for screenshots (signed in, running downloads): the example and the tests.
preview = []

[[example]]
name = "panels"
required-features = ["preview"]

[dev-dependencies]
# The example's engine role (`panels engine --api <port>`), as `crates/rustet` runs it.
rustet-engine = { path = "../rustet-engine" }
anyhow.workspace = true
tempfile = "3"
tokio-util.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
