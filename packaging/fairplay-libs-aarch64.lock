# cannot be redistributed with Rustet). Same format and rules as packaging/fairplay-libs-x86_64.lock (x86-64):
# scripts/fetch-fairplay-libs.sh downloads each file from the first source that serves it and
# refuses any file whose SHA-256 does not match. Both sources are the wrapper project's arm64
# branch, pinned to one commit. The `arch` line makes the script refuse this list on another CPU.
